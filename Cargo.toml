[package]
name = "hyprannotations"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Native Wayland screen annotations for Hyprland"

[dependencies]
anyhow = "1.0"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
tiny-skia = "0.11"
cosmic-text = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }

[profile.release]
lto = "thin"
strip = true
